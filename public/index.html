<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Star Circuit — Idle Orbit Merger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen">
  <div class="stars-bg" aria-hidden="true"></div>
  <div class="auth-card">
    <h1>STAR CIRCUIT</h1>
    <p class="tagline">An idle orbit merger. No ads, ever.</p>
    <div class="auth-tabs" role="tablist">
      <button id="tab-login" class="auth-tab active" type="button">Log in</button>
      <button id="tab-register" class="auth-tab" type="button">Register</button>
    </div>
    <label class="field-label" for="auth-user">Username</label>
    <input id="auth-user" type="text" autocomplete="username" maxlength="16"
           placeholder="3-16 chars: letters, numbers, _">
    <label class="field-label" for="auth-pass">Password</label>
    <input id="auth-pass" type="password" autocomplete="current-password" maxlength="64"
           placeholder="min 6 characters">
    <div id="auth-error" class="auth-error" role="alert"></div>
    <button id="auth-submit" class="primary-btn" type="button">Log in</button>
    <div class="divider"><span>or</span></div>
    <button id="guest-btn" class="ghost-btn" type="button">Play as guest</button>
    <p class="guest-note">Guest progress is saved on this device only. Log in to sync.</p>
  </div>
</div>

<!-- ============ GAME SCREEN ============ -->
<div id="game-screen" class="hidden">
  <header id="hud">
    <div class="hud-left">
      <div id="coins">0</div>
      <div id="cps">0/s</div>
    </div>
    <div class="hud-right">
      <div id="cores-line">Cores 0 &middot; &times;1</div>
      <button id="auth-btn" class="mini-btn" type="button">Log out</button>
    </div>
  </header>

  <div id="goal-strip">
    <div id="goal-bar"><div id="goal-fill"></div></div>
    <div id="goal-text">Goal (0/10)</div>
  </div>

  <main id="panel-game" class="panel">
    <div id="canvas-wrap"><canvas id="orbit"></canvas></div>
    <div id="boost-wrap">
      <div id="boost-track"><div id="boost-fill"></div></div>
      <div id="boost-label">Tap empty space for a speed boost</div>
    </div>
    <div id="btn-row">
      <button class="gbtn" id="btn-ship" type="button"><span class="t">ADD SHIP</span><span class="c" id="cost-ship"></span></button>
      <button class="gbtn" id="btn-ring" type="button"><span class="t">ADD RING</span><span class="c" id="cost-ring"></span></button>
      <button class="gbtn" id="btn-circuit" type="button"><span class="t">UPGRADE</span><span class="c" id="cost-circuit"></span></button>
      <button class="gbtn" id="btn-merge" type="button"><span class="t">MERGE</span><span class="c" id="cost-merge">auto</span></button>
      <button class="gbtn" id="btn-x2" type="button"><span class="t" id="x2-label">x2 SPEED</span><span class="c" id="x2-sub">ready</span></button>
      <button class="gbtn" id="btn-warp" type="button"><span class="t" id="warp-label">WARP</span><span class="c" id="warp-sub"></span></button>
    </div>
  </main>

  <section id="panel-goals" class="panel hidden">
    <h2 class="panel-title">Goals</h2>
    <div id="goals-list"></div>
  </section>

  <section id="panel-board" class="panel hidden">
    <div class="panel-head">
      <h2 class="panel-title">Leaderboard</h2>
      <button id="board-refresh" class="mini-btn" type="button">Refresh</button>
    </div>
    <div id="board-list"></div>
  </section>

  <section id="panel-news" class="panel hidden">
    <h2 class="panel-title">What's New</h2>
    <div id="news-list"></div>
  </section>

  <nav id="tabs">
    <button class="tabbtn active" data-tab="game" type="button">Game</button>
    <button class="tabbtn" data-tab="goals" type="button">Goals</button>
    <button class="tabbtn" data-tab="board" type="button">Board</button>
    <button class="tabbtn" data-tab="news" type="button">News</button>
  </nav>

  <div id="modal" class="hidden">
    <div class="modal-card">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-btns">
        <button id="modal-ok" class="primary-btn" type="button">OK</button>
        <button id="modal-cancel" class="ghost-btn" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
</div>

<script src="js/balance.js"></script>
<script src="js/app.js"></script>
</body>
</html>
